<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Source+Code+Pro&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- General styles -->
    <link rel="stylesheet" href="../assets/css/application.css"> <!-- Specific styles for application -->
    <style>
        .logo-img {
            height: 45px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><img src="../assets/images/studexplorelogo.png" alt="Studexplore Logo" class="logo-img"> Studexplore</div>
        <div class="nav-links">
            <a href="index.html#home">Home</a>
            <a href="opportunities.html">Opportunities</a>
            <a href="studentdashboard.html#profile">Profile</a>
            <a href="index.html" id="logout-link">Logout</a>
        </div>
    </nav>

    <main class="application-details-container">
        <h1>Application Details</h1>

        <div id="applicant-details">
            <h2>Applicant Details</h2>
            <div class="detail-group">
                <h3>Full Name</h3>
                <p id="applicant-full-name"></p>
            </div>
            <div class="detail-group">
                <h3>Email</h3>
                <p id="applicant-email"></p>
            </div>
        </div>

        <div id="application-details">
            <h2>Application Content</h2>
            <div class="detail-group">
                <h3>Why Choose me?</h3>
                <p id="why-choose-me-text"></p>
            </div>
            <div class="detail-group">
                <h3>Skills</h3>
                <p id="skills-text"></p>
            </div>
            <div class="detail-group">
                <h3>Experiences</h3>
                <p id="experiences-text"></p>
            </div>
        </div>

        <div class="application-actions">
            <div id="action-message" class="form-message"></div>
            <div class="message-box">
                <label for="company-message">Message to Student:</label>
                <textarea id="company-message" rows="4" placeholder="Type your message here..."></textarea>
            </div>
            <button id="approve-button" class="action-button">Approve</button>
            <button id="for-review-button" class="action-button">For Review</button>
            <button id="reviewed-button" class="action-button">Reviewed</button>
        </div>
    </main>

    <footer>
        <p>© 2025 Studexplore. All rights reserved.</p>
        <div class="social-media-links">
            <a href="#" aria-label="X">X</a>
            <a href="#" aria-label="Instagram">Instagram</a>
            <a href="#" aria-label="TikTok">TikTok</a>
        </div>
    </footer>

    <script src="../src/resources/login.js" type="module"></script> <!-- For logout() -->
    <script src="../assets/js/application-details.js" type="module" defer></script> <!-- Script to load and manage application details -->
</body>
</html>
