<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details</title>
    <link rel="stylesheet" href="style.css"> <!-- Using a general CSS for now -->
    <style>
        .logo-img {
            height: 40px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><img src="../../assets/images/studexplorelogo.png" alt="Studexplore Logo" class="logo-img"> Studexplore</div>
        <div class="nav-links">
            <!-- Add navigation links here if needed -->
        </div>
    </nav>
    <div class="container">
        <h2>User Details</h2>
        <div id="user-details">
            <!-- User details will be loaded here -->
            <p><strong>ID:</strong> <span id="user-id"></span></p>
            <p><strong>Username:</strong> <span id="user-username"></span></p>
            <p><strong>Role:</strong> <span id="user-role"></span></p>
            <p><strong>Email:</strong> <span id="user-email"></span></p>
            <p><strong>Major:</strong> <span id="user-major"></span></p>
            <p><strong>Graduation Year:</strong> <span id="user-graduation-year"></span></p>
            <p><strong>Industry:</strong> <span id="user-industry"></span></p>
            <p><strong>Location:</strong> <span id="user-location"></span></p>
            <p><strong>Description:</strong> <span id="user-description"></span></p>
        </div>
    </div>

    <script src="../src/resources/user.js" type="module"></script>
    <script type="module">
        import { initUserDetails } from '../src/resources/user.js';
        initUserDetails();
    </script>
</body>
</html>
