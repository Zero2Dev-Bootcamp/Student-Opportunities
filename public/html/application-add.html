<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Opportunity - Studexplore</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Source+Code+Pro&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- General styles -->
    <link rel="stylesheet" href="../assets/css/application.css"> <!-- Specific styles for application -->
    <style>
        .logo-img {
            height: 45px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><img src="../assets/images/studexplorelogo.png" alt="Studexplore Logo" class="logo-img"> Studexplore (Student)</div>
        <div class="nav-links">
            <a href="index.html#home">Home</a>
            <a href="opportunities.html">Opportunities</a>
            <a href="studentdashboard.html#profile">Profile</a>
            <a href="index.html" id="logout-link">Logout</a>
        </div>
    </nav>

    <main>
        <h1>Apply for Opportunity</h1>
        <div id="opportunity-details">
            <h2>Opportunity Title: <span id="opportunity-title">Loading...</span></h2>
            <!-- Display other relevant opportunity details here if fetched -->
        </div>

        <form id="applicationForm">
            
            <div class="form-group">
                <label for="notes">Notes / Cover Letter:</label>
                <textarea id="notes" name="notes" rows="8" required></textarea>
            </div>

            <div class="form-group">
                <label for="transcript">Transcript:</label>
                <input type="file" id="transcript" name="transcript" accept=".pdf,.doc,.docx">
            </div>

            <div class="form-group">
                <label for="enrollmentProof">Proof of Enrollment:</label>
                <input type="file" id="enrollmentProof" name="enrollmentProof" accept=".pdf,.doc,.docx">
            </div>

            <div class="form-group">
                <label for="otherFiles">Other Files (Resume, Portfolio, etc.):</label>
                <input type="file" id="otherFiles" name="otherFiles" multiple accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png">
            </div>

            <button type="submit" class="submit-button">Submit Application</button>
            <div id="applicationMessage" class="form-message"></div>
        </form>
    </main>

    <footer>
        <p>© 2025 Studexplore. All rights reserved.</p>
        <div class="social-media-links">
            <a href="#" aria-label="X">X</a>
            <a href="#" aria-label="Instagram">Instagram</a>
            <a href="#" aria-label="TikTok">TikTok</a>
        </div>
    </footer>

    <script src="../src/resources/login.js" type="module"></script> <!-- For logout() -->
    <script src="../assets/js/application-add.js" type="module" defer></script> <!-- Application form logic -->

</body>
</html>
